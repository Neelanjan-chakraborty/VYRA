# Local development dependencies. Credentials here are throwaway dev values only.
name: vyra-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vyra
      POSTGRES_PASSWORD: vyra
      POSTGRES_DB: vyra_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vyra -d vyra_dev']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
  # The Rust realtime gateway. Usually run with `pnpm dev:realtime` instead;
  # start this with `docker compose --profile realtime up` to run it in a container.
  realtime:
    profiles: ['realtime']
    build:
      context: ../..
      dockerfile: crates/vyra-realtime/Dockerfile
    environment:
      DATABASE_URL: postgresql://vyra:vyra@postgres:5432/vyra_dev
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET to the API's value}
      CORS_ORIGINS: http://localhost:8081,http://localhost:8099
    ports:
      - '4001:4001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
volumes:
  postgres-data:
