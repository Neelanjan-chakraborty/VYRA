[package]
name = "vyra-realtime"
version = "0.1.0"
description = "VYRA real-time gateway: WebSocket + MessagePack, Redis fan-out, presence and typing."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
dotenvy = "0.15"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
jsonwebtoken = { version = "12", default-features = false, features = ["rust_crypto"] }
redis = { version = "1.2", features = ["tokio-comp", "aio", "connection-manager"] }
rmp-serde = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }


[lints]
workspace = true
