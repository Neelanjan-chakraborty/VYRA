[package]
name = "vyra-engine-node"
version = "0.1.0"
description = "Node.js bindings (napi-rs) for vyra-engine, used in-process by the NestJS API."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
vyra-engine = { path = "../vyra-engine" }
napi = { version = "3.16", default-features = false, features = ["napi6"] }
napi-derive = "3.7"
serde = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2.6"

# The napi macros generate the FFI glue (unsafe by nature), so this crate does
# not inherit the workspace's `unsafe_code = "forbid"`; it contains no unsafe of its own.
[lints.clippy]
all = { level = "warn", priority = -1 }
