[package]
name = "vyra-engine"
version = "0.1.0"
description = "VYRA compatibility engine: deterministic scoring, gates, ranking and weight learning. No I/O."
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libm = "0.2"

[dev-dependencies]
flate2 = "1"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "engine"
harness = false

[lints]
workspace = true
